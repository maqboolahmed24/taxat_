<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer request list preview</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main data-testid="customer-request-list-preview" class="request-list-preview">
      <header>
        <p class="eyebrow">CustomerRequestListSnapshot</p>
        <h1>Customer request list preview</h1>
        <p id="dominant-question"></p>
      </header>
      <section class="route-strip" aria-label="Request list route">
        <span id="shell"></span>
        <span id="route"></span>
        <span id="selected-focus"></span>
      </section>
      <section id="rows" class="rows" aria-label="Customer requests"></section>
    </main>
    <script src="./app.js" type="module"></script>
  </body>
</html>
