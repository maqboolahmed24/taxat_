<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Continuity contract preview</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main data-testid="continuity-contract-preview" class="shell">
      <header class="page-header">
        <p>Workflow continuity</p>
        <h1>Continuity contract preview</h1>
      </header>
      <section class="layout" aria-label="Serialized continuity cases">
        <nav class="scenario-list" aria-label="Continuity scenarios" id="scenario-list"></nav>
        <article class="detail-panel" aria-live="polite">
          <h2 id="case-title"></h2>
          <dl class="metadata-grid" id="case-metadata"></dl>
          <section data-testid="continuity-route-focus-map" class="route-map" id="route-focus-map"></section>
          <section>
            <h3>Fallback order</h3>
            <ol data-testid="continuity-fallback-order" id="fallback-order"></ol>
          </section>
          <section>
            <h3>Invalidation reasons</h3>
            <ul data-testid="continuity-invalidation-reasons" id="invalidation-reasons"></ul>
          </section>
        </article>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
