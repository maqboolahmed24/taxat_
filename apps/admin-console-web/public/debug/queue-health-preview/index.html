<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Queue health preview</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main data-testid="queue-health-preview" class="shell">
      <section class="intro" aria-labelledby="queueHealthTitle">
        <p class="eyebrow">Internal contract preview</p>
        <h1 id="queueHealthTitle">Queue health preview</h1>
        <p class="lede">Persisted queue-health contract mirror for the staff work inbox.</p>
      </section>

      <section class="grid" aria-label="Persisted queue health contract">
        <article class="band" data-testid="queue-health-band" aria-label="Queue health band">
          <span class="label">Health</span>
          <strong id="healthScore"></strong>
          <span id="healthState" class="state"></span>
        </article>

        <article class="pressure" data-testid="queue-pressure-strip" aria-label="Queue pressure strip">
          <span class="label">Pressure</span>
          <div class="strip" aria-hidden="true">
            <span id="pressureFill"></span>
          </div>
          <strong id="pressureScore"></strong>
        </article>

        <article class="recommendation" data-testid="queue-intervention-card" aria-label="Queue intervention card">
          <span class="label">Recommendation</span>
          <strong id="recommendationState"></strong>
          <p id="recommendationBasis"></p>
        </article>
      </section>

      <section class="basis" aria-label="Contract basis">
        <span class="label">Persisted contract basis</span>
        <code id="basisHash"></code>
        <span id="sourcePolicy" class="source"></span>
      </section>

      <section aria-label="Queue reason table">
        <table data-testid="queue-reason-table">
          <caption>Reason codes</caption>
          <thead>
            <tr>
              <th scope="col">Order</th>
              <th scope="col">Code</th>
              <th scope="col">Source</th>
            </tr>
          </thead>
          <tbody id="reasonRows"></tbody>
        </table>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
