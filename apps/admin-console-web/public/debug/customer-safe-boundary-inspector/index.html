<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer-safe boundary inspector</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main data-testid="customer-safe-boundary-inspector" class="inspector-shell">
      <header class="inspector-header">
        <p class="eyebrow">Workflow boundary</p>
        <h1>Customer-safe boundary inspector</h1>
      </header>

      <section
        data-testid="visibility-binding-summary"
        class="summary-rail"
        aria-label="Visibility binding summary"
      >
        <dl>
          <div>
            <dt>Access binding</dt>
            <dd id="access-binding"></dd>
          </div>
          <div>
            <dt>Masking</dt>
            <dd id="masking"></dd>
          </div>
          <div>
            <dt>Cache partition</dt>
            <dd id="cache-partition"></dd>
          </div>
        </dl>
      </section>

      <section class="payload-grid" aria-label="Payload comparison">
        <article class="payload-panel" aria-labelledby="candidate-title">
          <h2 id="candidate-title">Candidate internal payload</h2>
          <pre data-testid="candidate-internal-payload" id="candidate-payload"></pre>
        </article>
        <article class="payload-panel" aria-labelledby="published-title">
          <h2 id="published-title">Published customer-safe payload</h2>
          <pre data-testid="published-customer-safe-payload" id="published-payload"></pre>
        </article>
      </section>

      <section class="stripped-panel" aria-labelledby="stripped-title">
        <h2 id="stripped-title">Stripped families</h2>
        <div id="stripped-families" class="chip-row"></div>
      </section>
    </main>
    <script src="./app.js" type="module"></script>
  </body>
</html>
