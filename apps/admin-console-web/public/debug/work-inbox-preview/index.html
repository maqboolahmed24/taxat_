<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Work inbox preview</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell" data-testid="work-inbox-preview">
      <header class="masthead">
        <div>
          <p class="eyebrow">CALM_SHELL</p>
          <h1>Work inbox preview</h1>
        </div>
        <div class="route-pill">/work/inbox</div>
      </header>

      <section class="health-band" data-testid="work-queue-health-band" aria-label="Queue health">
        <div>
          <span class="label">Queue health</span>
          <strong id="queueHealthScore">84</strong>
        </div>
        <div>
          <span class="label">Policy</span>
          <strong>CANONICAL_SORT_KEY_ONLY</strong>
        </div>
        <div>
          <span class="label">Live updates</span>
          <strong>DEFER_TO_ROUTING_CONTINUITY_STATE</strong>
        </div>
      </section>

      <section class="layout" aria-label="Inbox layout">
        <div class="inbox-list" id="inboxRows" aria-label="Inbox rows"></div>
        <aside class="detail-rail" data-testid="work-inbox-selected-row" aria-label="Selected row">
          <span class="label">Selected</span>
          <h2 id="selectedTitle">Payroll records needed</h2>
          <p id="selectedPosture">Focused row remains mounted during deferred reorder.</p>
        </aside>
      </section>

      <section class="delta-log" data-testid="delta-application-log" aria-label="Delta application log">
        <span class="label">Delta application log</span>
        <ol id="deltaLog"></ol>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
