<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Work item notification preview</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main data-testid="work-item-notification-preview" class="preview-shell">
      <header class="preview-header">
        <p class="eyebrow">Notification contract</p>
        <h1>Work item notification preview</h1>
      </header>

      <section class="controls" aria-label="Notification scenario">
        <label for="scenario">Scenario</label>
        <select id="scenario" name="scenario">
          <option value="customer">Customer request info</option>
          <option value="internal">Internal reassignment</option>
          <option value="suppressed">Suppressed stale open</option>
        </select>
      </section>

      <article class="notification-card" aria-label="Persisted notification">
        <div>
          <p class="card-label">Artifact</p>
          <h2 id="notification-title">Loading</h2>
        </div>
        <dl class="facts">
          <div>
            <dt>Visibility</dt>
            <dd id="visibility"></dd>
          </div>
          <div>
            <dt>Shell</dt>
            <dd id="shell"></dd>
          </div>
          <div>
            <dt>Open state</dt>
            <dd id="open-state"></dd>
          </div>
        </dl>
      </article>

      <section data-testid="notification-route-map" class="contract-panel" aria-labelledby="route-map-title">
        <h2 id="route-map-title">Route map</h2>
        <dl class="contract-grid">
          <div>
            <dt>Shell</dt>
            <dd id="route-shell"></dd>
          </div>
          <div>
            <dt>Target route</dt>
            <dd id="target-route"></dd>
          </div>
          <div>
            <dt>Module</dt>
            <dd id="target-module"></dd>
          </div>
          <div>
            <dt>Object anchor</dt>
            <dd id="object-anchor"></dd>
          </div>
        </dl>
      </section>

      <section data-testid="notification-focus-contract" class="contract-panel" aria-labelledby="focus-title">
        <h2 id="focus-title">Focus contract</h2>
        <dl class="contract-grid">
          <div>
            <dt>Focus anchor</dt>
            <dd id="focus-anchor"></dd>
          </div>
          <div>
            <dt>Restoration</dt>
            <dd id="focus-restoration"></dd>
          </div>
        </dl>
      </section>

      <section data-testid="notification-fallback-contract" class="contract-panel" aria-labelledby="fallback-title">
        <h2 id="fallback-title">Fallback contract</h2>
        <dl class="contract-grid">
          <div>
            <dt>Return route</dt>
            <dd id="return-route"></dd>
          </div>
          <div>
            <dt>Fallback route</dt>
            <dd id="fallback-route"></dd>
          </div>
          <div>
            <dt>Fallback reason</dt>
            <dd id="fallback-reason"></dd>
          </div>
        </dl>
      </section>

      <section data-testid="notification-suppression-state" class="contract-panel" aria-labelledby="suppression-title">
        <h2 id="suppression-title">Suppression state</h2>
        <p id="suppression-copy"></p>
      </section>
    </main>
    <script src="./app.js" type="module"></script>
  </body>
</html>
