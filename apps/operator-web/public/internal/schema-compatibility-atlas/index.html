<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Schema Compatibility Atlas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="schema-compatibility-atlas">
      <header class="top-bar">
        <div class="title-cluster">
          <div class="gate-sigil" aria-hidden="true">
            <span class="gate-sigil__outer"></span>
            <span class="gate-sigil__inner"></span>
            <span class="gate-sigil__rule"></span>
          </div>
          <div>
            <p class="eyebrow">Compatibility Observatory</p>
            <h1 id="page-title">Taxat Schema Compatibility Atlas</h1>
            <p class="subtitle" id="page-subtitle"></p>
          </div>
        </div>
        <div class="top-bar__meta">
          <span class="mono-chip" id="candidate-hash-badge"></span>
          <span class="mono-chip" id="baseline-hash-badge"></span>
          <span class="verdict-chip" id="verdict-chip"></span>
          <span class="reader-chip" id="reader-window-chip"></span>
          <span class="mode-chip" id="data-mode-chip"></span>
        </div>
      </header>

      <main class="workspace">
        <aside class="navigator">
          <div class="panel-heading">
            <p class="eyebrow">Drift families</p>
            <h2>Severity navigator</h2>
          </div>
          <p class="panel-copy" id="basis-statement"></p>
          <nav
            aria-label="Schema drift navigator grouped by severity families"
            data-testid="schema-diff-navigator"
          >
            <div class="navigator-list" id="group-list"></div>
          </nav>
        </aside>

        <section class="canvas">
          <section
            class="chronology"
            aria-label="Migration chronology ribbon"
            data-testid="chronology-ribbon"
          >
            <div class="panel-heading">
              <p class="eyebrow">Chronology</p>
              <h2>Expand to contract</h2>
            </div>
            <div class="phase-row" id="phase-row"></div>
            <div class="chronology-band" id="chronology-band"></div>
          </section>

          <section class="diff-panel">
            <div class="panel-heading">
              <p class="eyebrow">Delta cards</p>
              <h2>Structured diff detail</h2>
            </div>
            <p class="panel-copy" id="canvas-summary"></p>
            <div class="diff-grid" id="diff-card-grid"></div>
          </section>
        </section>

        <aside class="inspector" data-testid="delta-inspector">
          <div class="panel-heading">
            <p class="eyebrow">Inspector</p>
            <h2 id="inspector-title">Waiting for selection</h2>
          </div>
          <div id="inspector-body"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
