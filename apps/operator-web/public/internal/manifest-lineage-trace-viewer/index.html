<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Manifest Lineage Trace Viewer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="manifest-lineage-trace-viewer">
      <header class="top-bar">
        <div class="title-cluster">
          <svg class="fork-sigil" aria-hidden="true" viewBox="0 0 54 34">
            <path d="M4 17h18" />
            <path d="M22 17c9 0 10-12 24-12" />
            <path d="M22 17h27" />
            <path d="M22 17c9 0 10 12 24 12" />
          </svg>
          <div>
            <p class="eyebrow">Internal branch explorer</p>
            <h1>Manifest Lineage Trace Viewer</h1>
          </div>
        </div>
        <div class="trace-chip-row">
          <span class="chip chip--mono" id="trace-id-chip"></span>
          <span class="chip chip--accent" id="action-chip"></span>
          <span class="chip chip--reason" id="reason-chip"></span>
          <span class="chip chip--mono" id="prior-hash-chip"></span>
        </div>
      </header>

      <main class="workspace">
        <aside class="candidate-rail" aria-label="Branch candidates">
          <div class="rail-heading">
            <p class="eyebrow">Canonical candidates</p>
            <h2>Branch vocabulary</h2>
          </div>
          <div class="candidate-list" id="candidate-list"></div>
        </aside>

        <section class="explorer-canvas" data-testid="manifest-lineage-canvas">
          <section class="branch-ribbon" aria-label="Branch ribbon diagram">
            <div class="ribbon-header">
              <p class="eyebrow">Request-time branch outcome</p>
              <h2 id="ribbon-title"></h2>
            </div>
            <svg id="branch-ribbon-svg" viewBox="0 0 920 124" role="img"></svg>
          </section>

          <section class="decision-cards" id="decision-cards"></section>
        </section>

        <aside class="inspector" data-testid="lineage-trace-inspector">
          <div class="inspector-heading">
            <p class="eyebrow">Selected manifest evidence</p>
            <h2 id="inspector-title"></h2>
          </div>
          <div class="inspector-rows" id="inspector-rows"></div>
          <div class="nightly-context" id="nightly-context"></div>
          <div class="trace-refs" id="trace-refs"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
