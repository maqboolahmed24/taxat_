<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Config Resolution Atlas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="config-resolution-atlas">
      <header class="top-bar">
        <div class="title-block">
          <div class="glyph" aria-hidden="true">
            <span class="glyph__line glyph__line--one"></span>
            <span class="glyph__line glyph__line--two"></span>
            <span class="glyph__line glyph__line--three"></span>
          </div>
          <div>
            <p class="eyebrow">Frozen config ledger</p>
            <h1 id="page-title">Taxat Config Resolution Atlas</h1>
            <p class="subtitle" id="page-subtitle"></p>
          </div>
        </div>

        <div class="top-summary">
          <div class="chip-row">
            <span class="summary-chip" id="basis-chip"></span>
            <span class="summary-chip" id="completeness-chip"></span>
            <span class="summary-chip" id="flags-chip"></span>
          </div>
          <p class="basis-statement" id="basis-statement"></p>
        </div>
      </header>

      <main class="atlas-layout">
        <aside class="scenario-panel">
          <div class="panel-heading">
            <p class="eyebrow">Manifest selector</p>
            <h2 id="scenario-title">Scenario</h2>
          </div>
          <nav aria-label="Manifest selector" id="scenario-selector"></nav>
        </aside>

        <section class="stack-panel">
          <div class="stack-header">
            <div class="panel-heading">
              <p class="eyebrow">Layer rail</p>
              <h2>Frozen config strata</h2>
            </div>
            <button id="hash-vector-toggle" type="button">Show hash vector</button>
          </div>

          <div class="stack-layout">
            <nav aria-label="Config layer selector" class="layer-rail" id="layer-rail"></nav>
            <div class="stack-canvas" data-testid="config-stack" id="stack-canvas"></div>
          </div>
        </section>

        <aside class="inspector" data-testid="config-inspector">
          <div class="panel-heading">
            <p class="eyebrow">Inspector</p>
            <h2 id="inspector-title">Layer detail</h2>
          </div>
          <div class="inspector-body" id="inspector-body"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
