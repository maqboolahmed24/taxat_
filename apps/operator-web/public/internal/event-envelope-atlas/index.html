<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Event Envelope Atlas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="event-envelope-atlas">
      <header class="top-bar">
        <div class="title-block">
          <div class="packet-glyph" aria-hidden="true">
            <span class="packet-glyph__seal"></span>
            <span class="packet-glyph__trail"></span>
            <span class="packet-glyph__gate"></span>
          </div>
          <div>
            <p class="eyebrow">Messaging Foundation</p>
            <h1 id="page-title">Taxat Event Envelope Atlas</h1>
            <p class="subtitle" id="page-subtitle"></p>
          </div>
        </div>
        <div class="top-bar__summary">
          <span class="atlas-badge" id="envelope-badge"></span>
          <div class="chip-row">
            <span class="active-chip" id="active-family-chip"></span>
            <span class="active-chip active-chip--lane" id="active-lane-chip"></span>
          </div>
          <p class="basis-statement" id="basis-statement"></p>
        </div>
      </header>

      <main class="atlas-layout">
        <aside class="family-rail">
          <div class="panel-heading">
            <p class="eyebrow">Packet families</p>
            <h2>Durable meaning families</h2>
          </div>
          <nav aria-label="Message family rail and packet-lane posture">
            <ul id="family-list"></ul>
          </nav>
        </aside>

        <section class="lane-panel">
          <div class="panel-heading">
            <p class="eyebrow">Packet lane</p>
            <h2>Transport and durable gates</h2>
          </div>
          <div class="lane-axis" id="lane-axis"></div>
          <div class="lane-grid" id="lane-grid"></div>
        </section>

        <aside class="inspector" data-testid="event-envelope-inspector">
          <div class="panel-heading">
            <p class="eyebrow">Inspector</p>
            <h2 id="drawer-title">Loading packet detail</h2>
          </div>
          <div class="drawer-body" id="drawer-body"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
