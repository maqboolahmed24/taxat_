<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Object Lifecycle Atlas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="object-lifecycle-atlas">
      <header class="top-bar">
        <div class="title-block">
          <div class="vessel-glyph" aria-hidden="true">
            <span class="vessel-glyph__mast"></span>
            <span class="vessel-glyph__wake"></span>
            <span class="vessel-glyph__hull"></span>
          </div>
          <div>
            <p class="eyebrow">Object Storage Lifecycle</p>
            <h1 id="page-title">Taxat Object Lifecycle Atlas</h1>
            <p class="subtitle" id="page-subtitle"></p>
          </div>
        </div>
        <div class="top-bar__summary">
          <div class="chip-row">
            <span class="summary-chip summary-chip--forest" id="delivery-chip"></span>
            <span class="summary-chip summary-chip--umber" id="retention-badge"></span>
            <span class="summary-chip summary-chip--steel" id="active-class-chip"></span>
          </div>
          <p class="basis-statement" id="basis-statement"></p>
          <div class="class-selector" id="class-selector" role="group" aria-label="Object class selector"></div>
        </div>
      </header>

      <main class="atlas-layout">
        <aside class="stage-rail">
          <div class="panel-heading">
            <p class="eyebrow">Lifecycle rail</p>
            <h2>Storage stages</h2>
          </div>
          <nav aria-label="Lifecycle stage rail and delivery posture">
            <ul id="stage-list"></ul>
          </nav>
        </aside>

        <section class="river-panel">
          <div class="panel-heading">
            <p class="eyebrow">Lifecycle river</p>
            <h2 id="river-title">Object class flow</h2>
          </div>
          <div class="river-canvas" id="river-list"></div>
          <section class="branch-panel">
            <div class="panel-heading panel-heading--compact">
              <p class="eyebrow">Branch posture</p>
              <h2>Namespace, delivery, and history rails</h2>
            </div>
            <ul class="branch-list" id="branch-list"></ul>
          </section>
        </section>

        <aside class="inspector" data-testid="object-inspector">
          <div class="panel-heading">
            <p class="eyebrow">Inspector</p>
            <h2 id="inspector-title">Loading lifecycle detail</h2>
          </div>
          <div class="inspector-body" id="inspector-body"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
