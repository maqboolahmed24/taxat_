<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Binding Coverage Atlas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="binding-coverage-atlas">
      <header class="top-bar">
        <div class="repo-badge-block">
          <span class="repo-badge" id="bundle-badge">BND</span>
          <div>
            <p class="eyebrow">Codegen Ledger</p>
            <h1 id="repo-title">Taxat Binding Coverage Atlas</h1>
          </div>
        </div>
        <div class="top-bar__controls">
          <div class="chip-row" id="top-language-selector" aria-label="Binding language selector"></div>
          <span class="status-chip" id="generation-posture"></span>
        </div>
      </header>

      <main class="workspace-layout">
        <aside class="language-rail">
          <div class="panel-heading">
            <p class="eyebrow">Language posture</p>
            <h2>Binding languages</h2>
          </div>
          <nav aria-label="Binding languages and coverage posture" data-testid="language-rail">
            <ul id="language-list"></ul>
          </nav>
        </aside>

        <section class="canvas" data-testid="binding-canvas">
          <div class="canvas-summary">
            <p class="eyebrow">Generation posture</p>
            <p class="ledger-note" id="summary-copy"></p>
          </div>
          <div class="lineage-strip" aria-label="Binding lineage strip" id="lineage-strip"></div>
          <div class="canvas-grid">
            <section class="plane">
              <div class="panel-heading">
                <p class="eyebrow">Plane one</p>
                <h2>Schema Family</h2>
              </div>
              <div class="plane-list" id="family-list"></div>
            </section>
            <section class="plane">
              <div class="panel-heading">
                <p class="eyebrow">Plane two</p>
                <h2>Generated Output / Tool</h2>
              </div>
              <div class="plane-list" id="output-list"></div>
            </section>
            <section class="plane">
              <div class="panel-heading">
                <p class="eyebrow">Plane three</p>
                <h2>Coverage / Gap Posture</h2>
              </div>
              <div class="plane-list" id="coverage-list"></div>
            </section>
          </div>
        </section>

        <aside class="detail-drawer" data-testid="detail-drawer">
          <div class="panel-heading">
            <p class="eyebrow">Inspector</p>
            <h2 id="drawer-title">Loading binding detail</h2>
          </div>
          <div id="drawer-body"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
