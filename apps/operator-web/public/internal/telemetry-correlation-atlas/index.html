<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Telemetry Correlation Atlas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="telemetry-correlation-atlas">
      <header class="top-bar">
        <div class="title-block">
          <div class="glyph" aria-hidden="true">
            <span class="glyph__orbit glyph__orbit--one"></span>
            <span class="glyph__orbit glyph__orbit--two"></span>
            <span class="glyph__core"></span>
          </div>
          <div>
            <p class="eyebrow">Signal observatory</p>
            <h1 id="page-title">Telemetry Correlation Atlas</h1>
            <p class="subtitle" id="page-subtitle"></p>
          </div>
        </div>

        <div class="top-summary">
          <div class="chip-row">
            <span class="summary-chip" id="service-chip"></span>
            <span class="summary-chip" id="sampling-chip"></span>
            <span class="summary-chip" id="retention-chip"></span>
          </div>
          <p class="basis-statement" id="basis-statement"></p>
        </div>
      </header>

      <section class="scenario-strip">
        <div class="panel-heading">
          <p class="eyebrow">Scenario cabinet</p>
          <h2 id="scenario-title">Scenario</h2>
        </div>
        <nav aria-label="Telemetry scenario selector" id="scenario-selector"></nav>
      </section>

      <main class="atlas-layout">
        <aside class="signal-panel">
          <div class="panel-heading">
            <p class="eyebrow">Signal rail</p>
            <h2>Propagation stages</h2>
          </div>
          <nav aria-label="Telemetry signal selector" class="signal-rail" id="signal-rail"></nav>
        </aside>

        <section class="constellation-panel">
          <div class="panel-heading">
            <p class="eyebrow">Constellation</p>
            <h2>Correlation fan-out</h2>
          </div>
          <div class="constellation-canvas" data-testid="telemetry-constellation" id="constellation-canvas"></div>
        </section>

        <aside class="inspector" data-testid="telemetry-inspector">
          <div class="panel-heading">
            <p class="eyebrow">Inspector</p>
            <h2 id="inspector-title">Signal detail</h2>
          </div>
          <div class="inspector-body" id="inspector-body"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
