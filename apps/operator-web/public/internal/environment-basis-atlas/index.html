<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Environment Basis Atlas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="environment-basis-atlas">
      <header class="top-bar">
        <div class="title-block">
          <div class="strata-emblem" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <span class="family-badge" id="family-badge">ENV</span>
          <div>
            <p class="eyebrow">Runtime Basis Boundary</p>
            <h1 id="page-title">Taxat Environment Basis Atlas</h1>
          </div>
        </div>
        <div class="top-bar__summary">
          <div class="chip-row">
            <span class="chip" data-tone="teal" id="consumer-chip"></span>
            <span class="chip" data-tone="neutral" id="variable-chip"></span>
          </div>
          <p class="basis-statement" id="basis-statement"></p>
        </div>
      </header>

      <main class="atlas-layout">
        <aside class="consumer-rail">
          <div class="panel-heading">
            <p class="eyebrow">Runtime consumers</p>
            <h2>Boundary classes</h2>
          </div>
          <nav aria-label="Runtime consumers and environment posture">
            <ul id="consumer-list"></ul>
          </nav>
        </aside>

        <section class="atlas-canvas">
          <div class="canvas-header">
            <div class="panel-heading">
              <p class="eyebrow">Strata map</p>
              <h2>Legal runtime path</h2>
            </div>
            <div class="lineage-strip" id="lineage-strip" aria-label="Selected consumer source lineage"></div>
          </div>
          <section class="strata-panel" aria-labelledby="strata-title">
            <div class="panel-heading">
              <p class="eyebrow">Execution boundary</p>
              <h2 id="strata-title">Bootstrap, handle, freeze, and runtime carriage</h2>
            </div>
            <div class="strata-grid" id="strata-grid"></div>
          </section>
        </section>

        <aside class="detail-drawer" data-testid="detail-drawer">
          <div class="panel-heading">
            <p class="eyebrow">Inspector</p>
            <h2 id="drawer-title">Loading runtime detail</h2>
          </div>
          <div class="drawer-body" id="drawer-body"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
