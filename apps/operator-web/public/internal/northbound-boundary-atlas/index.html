<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Northbound Boundary Atlas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="northbound-boundary-atlas">
      <header class="top-bar">
        <div class="title-block">
          <div class="boundary-glyph" aria-hidden="true">
            <span class="boundary-glyph__ring"></span>
            <span class="boundary-glyph__bar"></span>
            <span class="boundary-glyph__seal"></span>
          </div>
          <div>
            <p class="eyebrow">Northbound Runtime</p>
            <h1 id="page-title">Taxat Northbound Boundary Atlas</h1>
            <p class="subtitle" id="page-subtitle"></p>
          </div>
        </div>

        <div class="top-bar__summary">
          <div class="top-chip-row">
            <span class="badge" id="route-stability-badge"></span>
            <span class="chip chip--posture" id="boundary-posture-chip"></span>
          </div>
          <div class="top-chip-row">
            <span class="chip" id="active-family-chip"></span>
            <span class="chip chip--stage" id="active-stage-chip"></span>
          </div>
          <p class="basis-statement" id="basis-statement"></p>
          <div class="selector-strip" id="family-selector" aria-label="Command family selector"></div>
        </div>
      </header>

      <main class="atlas-layout">
        <aside class="stage-rail">
          <div class="panel-heading">
            <p class="eyebrow">Boundary stages</p>
            <h2>Admission gate rail</h2>
          </div>
          <nav aria-label="Boundary stage rail and command-family posture">
            <ul id="stage-list"></ul>
          </nav>
        </aside>

        <section class="flow-panel">
          <div class="panel-heading">
            <p class="eyebrow">Flow canvas</p>
            <h2>Input, decision, durable output</h2>
          </div>
          <div class="flow-grid" id="flow-grid"></div>
        </section>

        <aside class="inspector">
          <div class="panel-heading">
            <p class="eyebrow">Inspector</p>
            <h2 id="inspector-title">Loading boundary family</h2>
          </div>
          <div class="inspector-body" id="inspector-body"></div>
        </aside>
      </main>

      <section class="schema-strip" aria-label="Imported contract schema hashes">
        <h2 class="schema-strip__title">Imported schema lineage</h2>
        <div class="schema-grid" id="schema-grid"></div>
      </section>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
