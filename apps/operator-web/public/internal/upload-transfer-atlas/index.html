<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Upload Transfer Atlas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="upload-transfer-atlas">
      <header class="top-bar">
        <div class="title-block">
          <div class="paperclip-ladder-glyph" aria-hidden="true">
            <span class="paperclip-ladder-glyph__clip"></span>
            <span class="paperclip-ladder-glyph__rail paperclip-ladder-glyph__rail--left"></span>
            <span class="paperclip-ladder-glyph__rail paperclip-ladder-glyph__rail--right"></span>
            <span class="paperclip-ladder-glyph__rung paperclip-ladder-glyph__rung--one"></span>
            <span class="paperclip-ladder-glyph__rung paperclip-ladder-glyph__rung--two"></span>
            <span class="paperclip-ladder-glyph__rung paperclip-ladder-glyph__rung--three"></span>
          </div>
          <div>
            <p class="eyebrow">Transfer observatory</p>
            <h1 id="page-title">Taxat Upload Transfer Atlas</h1>
            <p class="subtitle" id="page-subtitle"></p>
          </div>
        </div>

        <div class="top-bar__summary">
          <div class="summary-row">
            <div id="session-selector" role="group" aria-label="Upload session selector"></div>
            <span class="summary-chip summary-chip--teal" id="request-binding-badge"></span>
            <span class="summary-chip summary-chip--olive" id="resumability-chip"></span>
          </div>
          <p class="basis-statement" id="basis-statement"></p>
        </div>
      </header>

      <main class="atlas-layout">
        <aside class="status-rail">
          <div class="panel-heading">
            <p class="eyebrow">Status rail</p>
            <h2>Transfer stages</h2>
          </div>
          <nav aria-label="Upload transfer stages">
            <ul id="stage-list"></ul>
          </nav>
        </aside>

        <section class="ladder-panel">
          <div class="panel-heading panel-heading--split">
            <div>
              <p class="eyebrow">Chunk ladder</p>
              <h2 id="ladder-title">Governed byte windows</h2>
            </div>
            <div class="metric-strip">
              <span class="metric-chip" id="transfer-state-chip"></span>
              <span class="metric-chip" id="validation-state-chip"></span>
            </div>
          </div>

          <div class="ladder-stage-summary" id="stage-summary"></div>

          <div class="ladder-frame">
            <div class="ladder-shell">
              <div class="ladder-column" id="ladder-column"></div>
            </div>
            <div class="seam-list" id="seam-list" aria-live="polite"></div>
          </div>

          <div class="binding-panel" data-testid="binding-panel">
            <button
              type="button"
              class="binding-toggle"
              id="binding-toggle"
              aria-pressed="false"
              aria-label="View request binding contract"
            >
              View request binding contract
            </button>
            <div class="binding-details" id="binding-details" hidden></div>
          </div>
        </section>

        <aside class="inspector" data-testid="upload-transfer-inspector">
          <div class="panel-heading">
            <p class="eyebrow">Inspector</p>
            <h2 id="inspector-title">Loading upload detail</h2>
          </div>
          <div class="inspector-body" id="inspector-body"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
