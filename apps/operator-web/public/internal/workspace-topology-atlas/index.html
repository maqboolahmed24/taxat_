<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Workspace Topology Atlas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="workspace-topology-atlas">
      <header class="top-bar">
        <div class="repo-badge-block">
          <span class="repo-badge" id="repo-badge">TX</span>
          <div>
            <p class="eyebrow">Repository Foundry</p>
            <h1 id="repo-title">Taxat Workspace Topology Atlas</h1>
          </div>
        </div>
        <div class="chip-row top-bar__chips">
          <span class="chip" data-tone="neutral" id="language-stack-badge"></span>
          <span class="status-chip" id="bootstrap-posture"></span>
        </div>
      </header>

      <main class="workspace-layout">
        <aside class="family-rail">
          <div class="panel-heading">
            <p class="eyebrow">Workspace families</p>
            <h2>Bootstrap clusters</h2>
          </div>
          <nav aria-label="Workspace families and topology clusters" data-testid="family-rail">
            <ul id="family-list"></ul>
          </nav>
        </aside>

        <section class="canvas" data-testid="topology-canvas">
          <div class="canvas-summary">
            <p class="eyebrow">Topology posture</p>
            <p class="ledger-note" id="summary-copy"></p>
          </div>
          <div class="legend-strip" aria-label="Workspace legend" id="legend-strip"></div>
          <div class="canvas-grid">
            <section class="plane">
              <div class="panel-heading">
                <p class="eyebrow">Plane one</p>
                <h2>Ownership</h2>
              </div>
              <div class="plane-list" id="ownership-list"></div>
            </section>
            <section class="plane">
              <div class="panel-heading">
                <p class="eyebrow">Plane two</p>
                <h2>Dependency / Task Graph</h2>
              </div>
              <div class="plane-list" id="dependency-list"></div>
            </section>
            <section class="plane">
              <div class="panel-heading">
                <p class="eyebrow">Plane three</p>
                <h2>Runtime Surface</h2>
              </div>
              <div class="plane-list" id="runtime-list"></div>
            </section>
          </div>
        </section>

        <aside class="detail-drawer" data-testid="detail-drawer">
          <div class="panel-heading">
            <p class="eyebrow">Inspector</p>
            <h2 id="drawer-title">Loading workspace detail</h2>
          </div>
          <div id="drawer-body"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
