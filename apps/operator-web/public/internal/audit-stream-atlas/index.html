<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Audit Stream Atlas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="audit-stream-atlas">
      <header class="top-bar">
        <div class="title-block">
          <div class="glyph" aria-hidden="true">
            <span class="glyph__ring glyph__ring--outer"></span>
            <span class="glyph__ring glyph__ring--inner"></span>
            <span class="glyph__core"></span>
          </div>
          <div>
            <p class="eyebrow">Ledger continuity</p>
            <h1 id="page-title">Audit Stream Atlas</h1>
            <p class="subtitle" id="page-subtitle"></p>
          </div>
        </div>

        <div class="top-summary">
          <div class="chip-row">
            <span class="summary-chip" id="continuity-chip"></span>
            <span class="summary-chip" id="signature-chip"></span>
            <span class="summary-chip" id="retention-chip"></span>
          </div>
          <p class="basis-statement" id="basis-statement"></p>
        </div>
      </header>

      <section class="scenario-strip">
        <div class="panel-heading">
          <p class="eyebrow">Scenario cabinet</p>
          <h2 id="scenario-title">Scenario</h2>
        </div>
        <nav aria-label="Audit scenario selector" id="scenario-selector"></nav>
      </section>

      <main class="atlas-layout">
        <aside class="family-panel">
          <div class="panel-heading">
            <p class="eyebrow">Family rail</p>
            <h2>Governed rails</h2>
          </div>
          <nav aria-label="Audit family selector" class="family-rail" id="family-rail"></nav>
        </aside>

        <section class="ledger-panel">
          <div class="ledger-panel__header">
            <div class="panel-heading">
              <p class="eyebrow">Strict sequence</p>
              <h2 id="ledger-title">Selected stream</h2>
            </div>
            <nav aria-label="Audit stream selector" class="stream-selector" id="stream-selector"></nav>
          </div>
          <div class="ledger" data-testid="audit-ledger" id="ledger"></div>
        </section>

        <aside class="inspector" data-testid="audit-inspector">
          <div class="panel-heading">
            <p class="eyebrow">Inspector</p>
            <h2 id="inspector-title">Event detail</h2>
          </div>
          <div class="inspector-body" id="inspector-body"></div>
        </aside>
      </main>

      <section class="merged-panel">
        <div class="merged-panel__header">
          <div class="panel-heading">
            <p class="eyebrow">Narrative overlay</p>
            <h2>Merged explanation strip</h2>
          </div>
          <div class="mode-row" id="merged-mode-selector"></div>
        </div>
        <p class="focus-note" id="focus-note"></p>
        <div class="merged-body" id="merged-body"></div>
      </section>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
