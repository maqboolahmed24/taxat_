<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Reference Grammar Atlas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="reference-grammar-atlas">
      <header class="top-bar">
        <div class="title-block">
          <div class="lexicon-glyph" aria-hidden="true">
            <span class="glyph-node"></span>
            <span class="glyph-hash"></span>
            <span class="glyph-turn"></span>
          </div>
          <div>
            <p class="eyebrow">Reference Lexicon</p>
            <h1 id="page-title">Taxat Reference Grammar Atlas</h1>
            <p class="subtitle" id="page-subtitle"></p>
          </div>
        </div>
        <div class="top-bar__summary">
          <span class="grammar-badge" id="grammar-badge"></span>
          <span class="active-chip" id="active-family-chip"></span>
          <p class="basis-statement" id="basis-statement"></p>
        </div>
      </header>

      <main class="atlas-layout">
        <aside class="family-rail">
          <div class="panel-heading">
            <p class="eyebrow">Family rail</p>
            <h2>Reference families</h2>
          </div>
          <nav aria-label="Reference family rail and contract posture">
            <ul id="family-list"></ul>
          </nav>
        </aside>

        <section class="lattice-panel">
          <div class="panel-heading">
            <p class="eyebrow">Grammar lattice</p>
            <h2>Semantic role by durability and exposure posture</h2>
          </div>
          <div class="axes">
            <div class="axis axis--horizontal" id="axis-horizontal"></div>
            <div class="axis axis--vertical" id="axis-vertical"></div>
          </div>
          <div class="lattice-frame">
            <div class="lattice-grid" id="lattice-grid"></div>
          </div>
          <section class="transition-panel">
            <div class="panel-heading">
              <p class="eyebrow">Connection rules</p>
              <h2>Invalid substitutions for the active family</h2>
            </div>
            <ul id="transition-list"></ul>
          </section>
        </section>

        <aside class="inspector" data-testid="reference-inspector">
          <div class="panel-heading">
            <p class="eyebrow">Inspector</p>
            <h2 id="inspector-title">Loading family detail</h2>
          </div>
          <div class="inspector-body" id="inspector-body"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
