<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Code Quality Atlas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="code-quality-atlas">
      <header class="top-bar">
        <div class="repo-badge-block">
          <div class="loom-emblem" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <span class="repo-badge" id="repo-badge">QLT</span>
          <div>
            <p class="eyebrow">Repository Guardrails</p>
            <h1 id="repo-title">Taxat Code Quality Atlas</h1>
          </div>
        </div>
        <div class="chip-row top-bar__chips">
          <span class="chip" data-tone="neutral" id="workspace-context"></span>
          <p class="status-sentence" id="status-sentence"></p>
        </div>
      </header>

      <main class="atlas-layout">
        <aside class="family-rail">
          <div class="panel-heading">
            <p class="eyebrow">Guardrail families</p>
            <h2>Tool families</h2>
          </div>
          <nav aria-label="Code quality tool families">
            <ul id="family-list"></ul>
          </nav>
        </aside>

        <section class="loom-canvas" data-testid="loom-canvas">
          <div class="canvas-summary">
            <div>
              <p class="eyebrow">Dependency ribbon</p>
              <div class="dependency-ribbon" id="dependency-ribbon" aria-label="Quality dependency ribbon"></div>
            </div>
            <div>
              <p class="eyebrow">Selected family</p>
              <p class="ledger-note" id="family-summary"></p>
            </div>
          </div>

          <section class="lane-panel" aria-labelledby="lane-title">
            <div class="panel-heading">
              <p class="eyebrow">Stage loom</p>
              <h2 id="lane-title">Guardrail stage coverage</h2>
            </div>
            <div class="loom-grid" id="loom-grid">
              <div class="stage-header blank" aria-hidden="true"></div>
              <div class="stage-header">SAVE</div>
              <div class="stage-header">STAGED</div>
              <div class="stage-header">COMMIT</div>
              <div class="stage-header">CI</div>
            </div>
          </section>
        </section>

        <aside class="detail-drawer" data-testid="detail-drawer">
          <div class="panel-heading">
            <p class="eyebrow">Inspector</p>
            <h2 id="drawer-title">Loading quality tool detail</h2>
          </div>
          <div id="drawer-body"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
