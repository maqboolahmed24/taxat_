<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Canonical Primitives Atlas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="canonical-primitives-atlas">
      <header class="top-bar">
        <div class="title-block">
          <div class="kernel-emblem" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div>
            <p class="eyebrow">Primitive Specimen Tray</p>
            <h1 id="page-title">Taxat Canonical Primitives Atlas</h1>
          </div>
        </div>
        <div class="top-bar__summary">
          <div class="tab-strip" id="family-tabs" aria-label="Primitive family tabs"></div>
          <div class="chip-row">
            <span class="canonicality-badge" id="canonicality-badge"></span>
            <span class="chip" id="active-family-chip"></span>
          </div>
        </div>
      </header>

      <main class="atlas-layout">
        <aside class="family-rail">
          <div class="panel-heading">
            <p class="eyebrow">Primitive families</p>
            <h2>Canonical strata</h2>
          </div>
          <nav aria-label="Primitive families and canonical posture">
            <ul id="family-list"></ul>
          </nav>
        </aside>

        <section class="specimen-field">
          <div class="canvas-header">
            <div class="panel-heading">
              <p class="eyebrow">Specimen field</p>
              <h2>Four vertical columns, one active at a time</h2>
            </div>
            <p class="basis-statement" id="basis-statement"></p>
          </div>
          <div class="specimen-columns" id="specimen-columns"></div>
        </section>

        <aside class="detail-drawer" data-testid="detail-drawer">
          <div class="panel-heading">
            <p class="eyebrow">Inspector</p>
            <h2 id="drawer-title">Loading primitive detail</h2>
          </div>
          <div class="drawer-body" id="drawer-body"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
