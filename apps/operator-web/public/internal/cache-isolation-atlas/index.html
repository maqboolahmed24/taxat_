<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Cache Isolation Atlas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="cache-isolation-atlas">
      <header class="top-bar">
        <div class="title-block">
          <div class="glyph" aria-hidden="true">
            <span class="glyph__ring"></span>
            <span class="glyph__ring glyph__ring--inner"></span>
            <span class="glyph__seam"></span>
          </div>
          <div>
            <p class="eyebrow">Partition observatory</p>
            <h1 id="page-title">Taxat Cache Isolation Atlas</h1>
            <p class="subtitle" id="page-subtitle"></p>
          </div>
        </div>

        <div class="top-summary">
          <div class="chip-row">
            <span class="summary-chip" id="decision-chip"></span>
            <span class="summary-chip" id="mutation-gate-chip"></span>
            <span class="summary-chip" id="preview-chip"></span>
          </div>
          <p class="basis-statement" id="basis-statement"></p>
        </div>
      </header>

      <main class="atlas-layout">
        <aside class="scope-panel">
          <div class="panel-heading">
            <p class="eyebrow">Scope class</p>
            <h2>Cache scopes</h2>
          </div>
          <nav aria-label="Cache scope selector" id="scope-selector"></nav>
        </aside>

        <section class="scenario-panel">
          <div class="panel-heading">
            <p class="eyebrow">Scenario rail</p>
            <h2 id="scenario-title">Cache scenario</h2>
          </div>
          <div class="scenario-list" id="scenario-list"></div>
        </section>

        <aside class="inspector" data-testid="cache-inspector">
          <div class="panel-heading">
            <p class="eyebrow">Inspector</p>
            <h2 id="inspector-title">Cache binding detail</h2>
          </div>
          <div class="inspector-body" id="inspector-body"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
