<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Stream Recovery Atlas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="stream-recovery-atlas">
      <header class="top-bar">
        <div class="title-block">
          <div class="wave-glyph" aria-hidden="true">
            <span class="wave-glyph__line"></span>
            <span class="wave-glyph__line wave-glyph__line--offset"></span>
            <span class="wave-glyph__seam"></span>
          </div>
          <div>
            <p class="eyebrow">Epoch observatory</p>
            <h1 id="page-title">Taxat Stream Recovery Atlas</h1>
            <p class="subtitle" id="page-subtitle"></p>
          </div>
        </div>

        <div class="top-summary">
          <div class="summary-row">
            <div
              class="selector-group"
              id="scope-selector"
              role="group"
              aria-label="Stream scope selector"
            ></div>
            <span class="summary-chip" id="route-chip"></span>
            <span class="summary-chip summary-chip--danger" id="rebase-badge"></span>
          </div>
          <p class="basis-statement" id="basis-statement"></p>
        </div>
      </header>

      <main class="atlas-layout">
        <aside class="phase-rail">
          <div class="panel-heading">
            <p class="eyebrow">Event rail</p>
            <h2>Continuity phases</h2>
          </div>
          <nav aria-label="Continuity phase rail">
            <ul id="phase-list"></ul>
          </nav>
        </aside>

        <section class="canvas-panel">
          <div class="panel-heading panel-heading--split">
            <div>
              <p class="eyebrow">Sequence ribbon</p>
              <h2 id="canvas-title">Scope continuity</h2>
            </div>
            <button type="button" class="overlay-toggle" id="overlay-toggle"></button>
          </div>
          <div class="ribbon-grid" id="ribbon-grid"></div>
        </section>

        <aside class="inspector" data-testid="stream-inspector">
          <div class="panel-heading">
            <p class="eyebrow">Inspector</p>
            <h2 id="inspector-title">Loading continuity detail</h2>
          </div>
          <div class="inspector-body" id="inspector-body"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
