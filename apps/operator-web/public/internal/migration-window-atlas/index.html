<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Migration Window Atlas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="migration-window-atlas">
      <header class="top-bar">
        <div class="title-block">
          <div class="ladder-glyph" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div>
            <p class="eyebrow">Migration Observatory</p>
            <h1 id="page-title">Taxat Migration Window Atlas</h1>
            <p class="subtitle" id="page-subtitle"></p>
          </div>
        </div>
        <div class="top-bar__summary">
          <span class="summary-badge" id="schema-badge"></span>
          <span class="summary-badge" id="datastore-badge"></span>
          <span class="summary-chip" id="rollout-chip"></span>
          <p class="basis-statement" id="basis-statement"></p>
        </div>
      </header>

      <main class="atlas-layout">
        <aside class="state-rail">
          <div class="panel-heading">
            <p class="eyebrow">State rail</p>
            <h2>Migration posture</h2>
          </div>
          <nav aria-label="Migration state rail and rollout posture">
            <ul id="state-list"></ul>
          </nav>
        </aside>

        <section class="timeline-panel">
          <div class="panel-heading">
            <p class="eyebrow">Timeline canvas</p>
            <h2>Expand, backfill, verify, contract</h2>
          </div>
          <div class="phase-columns" id="phase-columns"></div>
          <div class="timeline-canvas" id="timeline-canvas"></div>
        </section>

        <aside class="inspector" data-testid="migration-inspector">
          <div class="panel-heading">
            <p class="eyebrow">Inspector</p>
            <h2 id="inspector-title">Loading migration detail</h2>
          </div>
          <div class="inspector-body" id="inspector-body"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
