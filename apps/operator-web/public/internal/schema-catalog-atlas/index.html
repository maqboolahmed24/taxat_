<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Schema Catalog Atlas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="schema-catalog-atlas">
      <header class="top-bar">
        <div class="repo-badge-block">
          <span class="repo-badge" id="bundle-badge">CTS</span>
          <div>
            <p class="eyebrow">Contract Cabinet</p>
            <h1 id="repo-title">Taxat Schema Catalog Atlas</h1>
          </div>
        </div>
        <div class="chip-row top-bar__chips">
          <span class="chip" data-tone="neutral" id="schema-count-badge"></span>
          <span class="status-chip" id="import-posture"></span>
        </div>
      </header>

      <main class="workspace-layout">
        <aside class="family-rail">
          <div class="panel-heading">
            <p class="eyebrow">Schema clusters</p>
            <h2>Family rail</h2>
          </div>
          <nav aria-label="Schema families and document clusters" data-testid="family-rail">
            <ul id="family-list"></ul>
          </nav>
        </aside>

        <section class="canvas" data-testid="schema-catalog-canvas">
          <div class="canvas-summary">
            <p class="eyebrow">Import posture</p>
            <p class="ledger-note" id="summary-copy"></p>
          </div>
          <div class="reference-ribbon" id="reference-ribbon" aria-label="Schema sample validator ribbon"></div>
          <div class="canvas-grid">
            <section class="plane">
              <div class="panel-heading">
                <p class="eyebrow">Plane one</p>
                <h2>Schema Identity</h2>
              </div>
              <div class="plane-list" id="identity-list"></div>
            </section>
            <section class="plane">
              <div class="panel-heading">
                <p class="eyebrow">Plane two</p>
                <h2>Source / Hash Lineage</h2>
              </div>
              <div class="plane-list" id="lineage-list"></div>
            </section>
            <section class="plane">
              <div class="panel-heading">
                <p class="eyebrow">Plane three</p>
                <h2>Sample / Validator Binding</h2>
              </div>
              <div class="plane-list" id="binding-list"></div>
            </section>
          </div>
        </section>

        <aside class="detail-drawer" data-testid="detail-drawer">
          <div class="panel-heading">
            <p class="eyebrow">Inspector</p>
            <h2 id="drawer-title">Loading schema detail</h2>
          </div>
          <div id="drawer-body"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
