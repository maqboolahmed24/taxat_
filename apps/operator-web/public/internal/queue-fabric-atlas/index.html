<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taxat Queue Fabric Atlas</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" data-testid="queue-fabric-atlas">
      <header class="top-bar">
        <div class="title-block">
          <div class="spool-glyph" aria-hidden="true">
            <span class="spool-glyph__ring"></span>
            <span class="spool-glyph__ring spool-glyph__ring--inner"></span>
            <span class="spool-glyph__spindle"></span>
          </div>
          <div>
            <p class="eyebrow">Worker Dispatch Fabric</p>
            <h1 id="page-title">Taxat Queue Fabric Atlas</h1>
            <p class="subtitle" id="page-subtitle"></p>
          </div>
        </div>
        <div class="top-summary">
          <div class="chip-row">
            <span class="summary-chip summary-chip--indigo" id="active-family-chip"></span>
            <span class="summary-chip summary-chip--bronze" id="ordering-badge"></span>
            <span class="summary-chip summary-chip--evergreen" id="dead-letter-chip"></span>
          </div>
          <p class="basis-statement" id="basis-statement"></p>
          <p class="payload-statement" id="payload-statement"></p>
          <div
            class="family-selector"
            id="family-selector"
            role="group"
            aria-label="Queue family selector"
          ></div>
        </div>
      </header>

      <main class="atlas-layout">
        <aside class="stage-rail">
          <div class="panel-heading">
            <p class="eyebrow">Lifecycle rail</p>
            <h2>Dispatch stages</h2>
          </div>
          <nav aria-label="Dispatch stage rail and queue posture">
            <ul id="stage-list"></ul>
          </nav>
        </aside>

        <section class="canvas-panel">
          <div class="panel-heading panel-heading--split">
            <div>
              <p class="eyebrow">Dispatch braid</p>
              <h2 id="canvas-title">Queue family strands</h2>
            </div>
            <div class="canvas-legend">
              <span>OUTBOX</span>
              <span>QUEUE</span>
              <span>CLAIM</span>
              <span>WORKER</span>
              <span>INBOX</span>
              <span>AUDIT</span>
            </div>
          </div>
          <div class="family-grid" id="family-grid"></div>
        </section>

        <aside class="inspector" data-testid="queue-inspector">
          <div class="panel-heading">
            <p class="eyebrow">Inspector</p>
            <h2 id="inspector-title">Loading dispatch detail</h2>
          </div>
          <div class="inspector-body" id="inspector-body"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
