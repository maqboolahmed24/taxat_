name: Contract Integrity

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-integrity:
    name: Contract integrity gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Algorithm/requirements-dev.txt

      - name: Install validator dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: python3 -m pip install -r Algorithm/requirements-dev.txt

      - name: Run contract integrity gate
        run: bash scripts/ci/run_contract_integrity_gate.sh
