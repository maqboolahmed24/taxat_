[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
  "python/generated_contract_models/src/taxat_generated_contract_models/generated",
  "packages/contracts-core/python",
  "Algorithm/scripts",
  "Algorithm/tools",
  ".venv",
  "node_modules",
  "automation/provisioning/artifacts",
  "test-results",
  "native/TaxatOperator/.build",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
"Algorithm/scripts/*.py" = ["E501"]
"Algorithm/tools/*.py" = ["E501"]
"tools/analysis/*.py" = ["E501"]
"tools/analysis/build_state_machine_registry.py" = ["F821"]
"tools/security/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
