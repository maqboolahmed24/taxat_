[project]
name = "taxat-validators"
version = "0.0.0"
description = "Bootstrap entrypoint layout for Taxat contract validators, forensic guards, and offline tooling."
requires-python = ">=3.14"

[project.scripts]
taxat-validators = "taxat_validators.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
